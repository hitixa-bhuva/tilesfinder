      <link rel="stylesheet" type="text/css" href="./assest/css/component.css" />
      <script src="./assest/js/modernizr.custom.js"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Caramel&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="errorstyle-sidebarBackdrop" class="errorstyle-sidebar-backdrop"></div>

    <header class="errorstyle-header">
        <div class="errorstyle-header-container">
            <a href="index.html">
                <img src="./assest/img/logo/TilesFinder 1.png" alt="TilesFinder Logo" class="errorstyle-logo" />
            </a>
            <!-- Sidebar + Nav -->
      <nav class="errorstyle-sidebar" id="sidebarMenu">
        <ul class="errorstyle-nav-menu">
          <li><a href="product.html">Designs</a></li>
          <li><a href="mockup.html">Mockups</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Contact us</a></li>
          <li><a href="aboutUs.html">About us</a></li>
          <li class="d-block d-md-none"><a href="aboutUs.html">Privacy Policy</a></li>
        </ul>
      </nav>
       <!-- Mobile Toggle Button -->
      <button class="errorstyle-mobile-menu-toggle" id="mobileToggle">☰</button>
        </div>
    </header>

    <main class="errorstyle-main-content">
        <div class="errorstyle-error-section">
            <div class="errorstyle-stack-container errorstyle-flip-stack">
                <div class="errorstyle-tile">
                    <div class="errorstyle-front errorstyle-big-fonts">4</div>
                    <div class="errorstyle-back errorstyle-big-fonts">4</div>
                </div>
                <div class="errorstyle-tile">
                    <div class="errorstyle-front errorstyle-big-fonts">0</div>
                    <div class="errorstyle-back errorstyle-big-fonts">0</div>
                </div>
                <div class="errorstyle-tile">
                    <div class="errorstyle-front errorstyle-big-fonts">4</div>
                    <div class="errorstyle-back errorstyle-big-fonts">4</div>
                </div>
            </div>

            <h2>Oops! Page not found</h2>
            <p class="errorstyle-message">The page you’re looking for doesn’t exist or has been moved.</p>
            <a href="index.html" class="errorstyle-home-button">Go Back Home</a>
        </div>
    </main>

    <footer class="errorstyle-footer">
        <div class="container-fluid">
            <div class="row text-center">
                <div class="col-md-12 errorstyle-justify-space-between">
                    <p class="mb-0">
                        Copyright © 2025 <a href="index.html" target="_blank" class="text-white text-decoration-none"> TilesFinders </a>, All rights Developed by
                        <a href="https://theuniqueitsolution.com/" target="_blank" class="text-white text-decoration-none">Unique IT Solution</a>
                    </p>
                    <p class="mb-0 d-none d-md-block"><a href="privacypolicy.html" class="privacypolicy-text">Privacy Policy</a></p>
                </div>
            </div>
        </div>
    </footer>
<script>
  const mobileToggle = document.getElementById('mobileToggle');
  const sidebar = document.getElementById('sidebarMenu');
  const backdrop = document.getElementById('errorstyle-sidebarBackdrop');

  mobileToggle.addEventListener('click', () => {
    const isActive = sidebar.classList.toggle('active');
    backdrop.classList.toggle('active', isActive);
    mobileToggle.textContent = isActive ? '✕' : '☰';
  });

  document.querySelectorAll('.errorstyle-nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
      sidebar.classList.remove('active');
      backdrop.classList.remove('active');
      mobileToggle.textContent = '☰';
    });
  });

  backdrop.addEventListener('click', () => {
    sidebar.classList.remove('active');
    backdrop.classList.remove('active');
    mobileToggle.textContent = '☰';
  });
</script>

</body>
</html>
