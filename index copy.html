<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Navbar & Sidebar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .filter-toggle-btn {
      display: none;
      font-size: 20px;
      background: none;
      border: none;
    }

    /* === Sidebar Filter === */
    #homesidebar {
      background: #f9f9f9;
      padding: 20px;
    }

    /* Mobile Sidebar Overlay */
    @media (max-width: 767px) {
      #homesidebar {
        position: fixed;
        top: 0;
        left: -295px;
        width: 250px;
        height: 100%;
        background: white;
        z-index: 1050;
        transition: left 0.3s ease;
        box-shadow: 2px 0 5px rgba(0,0,0,0.2);
      }

      #homesidebar.open {
        left: 0;
      }

      #sliderbackdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1040;
      }

      #sliderbackdrop.show {
        display: block;
      }

      .filter-toggle-btn {
        display: inline-block;
      }

      .navbar-links {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar (Visible in all views) -->
  <nav class="navbar">
    <button class="filter-toggle-btn" onclick="openSidebar()">☰ Filter</button>
  </nav>

  <!-- Main Layout -->
  <div style="display: flex;">
    <!-- Sidebar Filter (always visible on desktop, slides in on mobile) -->
    <div id="homesidebar">
      <h4>Filter</h4>
      <button class="filter-toggle-btn" onclick="closeSidebar()">✕</button>
      <hr>
      <label><input type="checkbox"> Category 1</label><br>
      <label><input type="checkbox"> Category 2</label><br>
    </div>

    <!-- Main Content -->
    <div style="flex-grow: 1; padding: 20px;">
      <h2>Page Content</h2>
      <p>This is your main content section.</p>
    </div>
  </div>

  <!-- Backdrop for mobile -->
  <div id="sliderbackdrop" onclick="closeSidebar()"></div>

  <!-- JS Logic -->
  <script>
    function openSidebar() {
      document.getElementById('homesidebar').classList.add('open');
      document.getElementById('sliderbackdrop').classList.add('show');
    }

    function closeSidebar() {
      document.getElementById('homesidebar').classList.remove('open');
      document.getElementById('sliderbackdrop').classList.remove('show');
    }
  </script>

</body>
</html>
