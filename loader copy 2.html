<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tiles Loader - Grid to Logo</title>
<style>

    body, html {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      background-color: #ffffff;

      display: flex;

      justify-content: center;

      align-items: center;

    }

    .loader-container {

      position: relative;

      width: 180px;

      height: 60px;

    }

    .tile {

      width: 30px;

      height: 30px;

      position: absolute;

      border: 2px solid;

      background-color: transparent;

      box-sizing: border-box;

    }

    .logo-container {

      position: absolute;

      width: 200px;

      height: 60px;

      opacity: 0;

    }

    .logo-container img {

      width: 100%;

      height: auto;

    }
</style>
</head>
<body>
<div class="loader-container">
<div class="tile" id="tile1"></div>
<div class="tile" id="tile2"></div>
<div class="tile" id="tile3"></div>
<div class="tile" id="tile4"></div>
<div class="tile" id="tile5"></div>
<div class="tile" id="tile6"></div>
<div class="tile" id="tile7"></div>
<div class="tile" id="tile8"></div>
<div class="tile" id="tile9"></div>
<div class="tile" id="tile10"></div>
<div class="tile" id="tile11"></div>
<div class="tile" id="tile12"></div>
<div class="logo-container" id="logo">
<img src="https://tilesfinders.com/assest/img/logo/TilesFinder%201.svg" alt="TilesFinder Logo" />
</div>
</div>
 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>

    const colors = ["#4169E1", "#DAA520"];

    const tilePositions = [

      { id: "tile1", x: 0, y: 0 },

      { id: "tile2", x: 30, y: 0 },

      { id: "tile3", x: 60, y: 0 },

      { id: "tile4", x: 90, y: 0 },

      { id: "tile5", x: 120, y: 0 },

      { id: "tile6", x: 150, y: 0 },

      { id: "tile7", x: 0, y: 30 },

      { id: "tile8", x: 30, y: 30 },

      { id: "tile9", x: 60, y: 30 },

      { id: "tile10", x: 90, y: 30 },

      { id: "tile11", x: 120, y: 30 },

      { id: "tile12", x: 150, y: 30 },

    ];
 
    function startAnimation() {

      const tl = gsap.timeline({ onComplete: startAnimation });
 
      tilePositions.forEach((tile, index) => {

        const el = document.getElementById(tile.id);

        gsap.set(el, {

          x: tile.x,

          y: tile.y,

          borderColor: colors[index % 2],

          opacity: 1,

          scale: 1

        });

      });
 
      tilePositions.forEach((tile, i) => {

        const el = document.getElementById(tile.id);

        tl.fromTo(el,

          { x: tile.x + (Math.random() * 300 - 150), y: tile.y + (Math.random() * 200 - 100), scale: 0 },

          { x: tile.x, y: tile.y, scale: 1, duration: 0.5, ease: "power2.out" },

          i * 0.03

        );

      });
 
      tl.to(".tile", {

        opacity: 0,

        scale: 0,

        duration: 0.2,

        ease: "power1.in",

        stagger: 0.01

      }, "+=0.1");
 
      tl.to("#logo", {

        opacity: 1,

        duration: 0.4,

        ease: "power2.out"

      });
 
      tl.to("#logo", {  

        opacity: 0,

        duration: 0.2,

        ease: "power2.in"

      }, "+=0.5");

    }
 
    startAnimation();
</script>
</body>
</html>
