<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tiles Loader - Real Tile Images</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loader-container {
      position: relative;
      width: 180px;
      height: 60px;
    }

    .tile {
      width: 30px;
      height: 30px;
      position: absolute;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-container {
      position: absolute;
      width: 200px;
      height: 60px;
      opacity: 0;
    }

    .logo-container img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="tile" id="tile1"><img src="./assest/img/new-resizeimg/big-square-brick-wal..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile2"><img src="./assest/img/new-resizeimg/300-450/background-textured-..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile3"><img src="./assest/img/new-resizeimg/600-1200/seamless-textured-po..._imresizer (1).jpg" alt=""></div>
    <div class="tile" id="tile4"><img src="./assest/img/new-resizeimg/600-12002/shared image (15).jpg" alt=""></div>
    <div class="tile" id="tile5"><img src="./assest/img/new-resizeimg/white-brick-wall-tex..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile6"><img src="./assest/img/new-resizeimg/300-450/colored-realistic-ce..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile7"><img src="./assest/img/new-resizeimg/800-1600/seamless-textured-po..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile8"><img src="./assest/img/new-resizeimg/800-1600/seamless-textured-po..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile9"><img src="./assest/img/new-resizeimg/300-600/white-marble-pattern..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile10"><img src="./assest/img/new-resizeimg/600-1800/gray-mosaic-tiles-te..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile11"><img src="./assest/img/new-resizeimg/800-1600/tile-background_7419..._imresizer.jpg" alt=""></div>
    <div class="tile" id="tile12"><img src="./assest/img/new-resizeimg/600-1200/white-marble-texture..._imresizer.jpg" alt=""></div>

    <div class="logo-container" id="logo">
      <img src="https://tilesfinders.com/assest/img/logo/TilesFinder%201.svg" alt="TilesFinder Logo" />
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const tilePositions = [
      { id: "tile1", x: 0, y: 0 },
      { id: "tile2", x: 30, y: 0 },
      { id: "tile3", x: 60, y: 0 },
      { id: "tile4", x: 90, y: 0 },
      { id: "tile5", x: 120, y: 0 },
      { id: "tile6", x: 150, y: 0 },
      { id: "tile7", x: 0, y: 30 },
      { id: "tile8", x: 30, y: 30 },
      { id: "tile9", x: 60, y: 30 },
      { id: "tile10", x: 90, y: 30 },
      { id: "tile11", x: 120, y: 30 },
      { id: "tile12", x: 150, y: 30 },
    ];

    // Set initial positions
    tilePositions.forEach((tile) => {
      const el = document.getElementById(tile.id);
      gsap.set(el, {
        x: tile.x,
        y: tile.y
      });
    });

    // Animation timeline
    const tl = gsap.timeline();

    tilePositions.forEach((tile, i) => {
      const el = document.getElementById(tile.id);
      tl.fromTo(el,
        { 
          x: tile.x + (Math.random() * 300 - 150), 
          y: tile.y + (Math.random() * 200 - 100), 
          scale: 0 
        },
        { 
          x: tile.x, 
          y: tile.y, 
          scale: 1, 
          duration: 0.6, 
          ease: "back.out(1.7)" 
        },
        i * 0.05
      );
    });

    tl.to(".tile", {
      rotationY: 360,
      duration: 1.2,
      ease: "power2.inOut",
      stagger: 0.03
    });

    tl.to(".tile", {
      opacity: 0,
      scale: 0,
      duration: 0.6,
      ease: "power1.in",
      stagger: 0.02
    }, "+=0.3");

    tl.to("#logo", {
      opacity: 1,
      duration: 0.8,
      ease: "power2.out"
    });
  </script>

</body>
</html>
