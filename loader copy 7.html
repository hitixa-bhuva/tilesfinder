<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }

    #dotCanvas {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(65, 105, 225, 0.15);
      will-change: transform;
    }

    .bg-shadow {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(65, 105, 225, 0.1), transparent 70%);
      z-index: 1;
      pointer-events: none;
    }

    .loader-container {
      position: relative;
      width: 180px;
      height: 60px;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .tile {
      width: 30px;
      height: 30px;
      position: absolute;
      border: 2px solid;
      background-color: transparent;
      box-sizing: border-box;
    }

    .logo-container {
      position: absolute;
      width: 200px;
      height: 60px;
      opacity: 0;
    }

    .logo-container img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div id="dotCanvas"></div>
  <div class="bg-shadow"></div>

  <div class="loader-container">
    <div class="tile" id="tile1"></div>
    <div class="tile" id="tile2"></div>
    <div class="tile" id="tile3"></div>
    <div class="tile" id="tile4"></div>
    <div class="tile" id="tile5"></div>
    <div class="tile" id="tile6"></div>
    <div class="tile" id="tile7"></div>
    <div class="tile" id="tile8"></div>
    <div class="tile" id="tile9"></div>
    <div class="tile" id="tile10"></div>
    <div class="tile" id="tile11"></div>
    <div class="tile" id="tile12"></div>
    <div class="logo-container" id="logo">
      <img src="https://tilesfinders.com/assest/img/logo/TilesFinder%201.svg" alt="TilesFinder Logo" />
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const dotCanvas = document.getElementById("dotCanvas");
    const colors = ["#4169E1", "#DAA520"];
    const tilePositions = [...Array(12).keys()].map(i => ({
      id: `tile${i + 1}`,
      x: (i % 6) * 30,
      y: Math.floor(i / 6) * 30
    }));

    // Loader animation
    function startAnimation() {
      const tl = gsap.timeline({ onComplete: startAnimation });
      tilePositions.forEach((tile, i) => {
        const el = document.getElementById(tile.id);
        gsap.set(el, {
          x: tile.x,
          y: tile.y,
          borderColor: colors[i % 2],
          opacity: 1,
          scale: 1
        });
        tl.fromTo(el,
          {
            x: tile.x + (Math.random() * 300 - 150),
            y: tile.y + (Math.random() * 200 - 100),
            scale: 0
          },
          {
            x: tile.x,
            y: tile.y,
            scale: 1,
            duration: 0.5,
            ease: "power2.out"
          },
          i * 0.03
        );
      });

      tl.to(".tile", {
        opacity: 0,
        scale: 0,
        duration: 0.2,
        ease: "power1.in",
        stagger: 0.01
      }, "+=0.1");

      tl.to("#logo", {
        opacity: 1,
        duration: 0.4,
        ease: "power2.out"
      });

      tl.to("#logo", {
        opacity: 0,
        duration: 0.2,
        ease: "power2.in"
      }, "+=0.5");
    }

    startAnimation();

    // Dots logic
    let dots = [];
    const mouse = { x: -1000, y: -1000 };
    const clearRadius = 80;

    function createDot(x, y, size, fadeIn = true) {
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${x}px`;
      dot.style.top = `${y}px`;
      dot.style.backgroundColor = `rgba(65, 105, 225, ${Math.random() * 0.2 + 0.05})`;
      dotCanvas.appendChild(dot);
      dots.push(dot);

      if (fadeIn) {
        gsap.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 1 });
      }

      moveDot(dot);
    }

    function moveDot(dot) {
      gsap.to(dot, {
        x: `+=${gsap.utils.random(-20, 20)}`,
        y: `+=${gsap.utils.random(-20, 20)}`,
        duration: gsap.utils.random(3, 5),
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true
      });
    }

    function generateInitialDots(count = 100) {
      for (let i = 0; i < count; i++) {
        const size = Math.random() * 8 + 2;
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        createDot(x, y, size, false);
      }
    }

    // Remove dots near mouse cursor
    function checkMouseZone() {
      dots.forEach(dot => {
        const rect = dot.getBoundingClientRect();
        const dx = rect.left - mouse.x;
        const dy = rect.top - mouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        dot.style.opacity = distance < clearRadius ? "0" : "";
      });
      requestAnimationFrame(checkMouseZone);
    }

    document.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    document.addEventListener("click", e => {
      // Add 10 more dots around click
      for (let i = 0; i < 10; i++) {
        const size = Math.random() * 6 + 2;
        const x = e.clientX + gsap.utils.random(-30, 30);
        const y = e.clientY + gsap.utils.random(-30, 30);
        createDot(x, y, size);
      }
    });

    generateInitialDots();
    checkMouseZone();
  </script>
</body>
</html>
