<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Hide mobile sidebar (if exists) */
.filter-menu-mobile {
  display: none !important;
}

/* Make desktop sidebar act as slide-in on mobile */
@media (max-width: 991px) {
  .filter-home-col-2 {
    transform: translateX(100%);
    transition: transform 0.3s ease;
    position: fixed;
    top: 0;
    right: -12px;
    width: 80%;
    height: 100%;
    background: #fff;
    z-index: 1050;
    box-shadow: -2px 0 10px rgba(0,0,0,0.2);
  }

  .filter-home-col-2.active {
    transform: translateX(0);
  }

  .filter-toggle {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1100;
    background: #007bff;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
  }

  .filter-close {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 20px;
    background: none;
    border: none;
    color: #000;
  }
}

/* On desktop: show sidebar always */
@media (min-width: 992px) {
  .filter-home-col-2 {
    transform: none !important;
    position: static !important;
    width: auto !important;
    height: auto !important;
    background: none !important;
    box-shadow: none !important;
  }

  .filter-toggle {
    display: none !important;
  }
}

    </style>
</head>
<body>
    <!-- Sidebar -->
<div class="col-md-2 filter-home-col-2">
  <div id="filterMenu" class="filter-sidebar">
    <div class="filter-header">
      <h5>
        <!-- SVG funnel icon -->
        Filter
      </h5>
      <!-- Close button (mobile only) -->
      <button class="filter-close d-block d-lg-none" onclick="closeFilter()">✕</button>
    </div>
    <hr />
    <div class="filter-section">
                    <h6 class="filter-header">Applied filters <span class="count-cleare">Clear all</span></h6>
                    <div>
                        <div class="filter-options">
                            <span class="filter-badge">395×395 mm ×</span>
                            <span class="filter-badge">Ceramic ×</span>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="filter-section">
                    <h6 class="filter-header" data-bs-toggle="collapse" aria-expanded="false" href="#byType" role="button" aria-controls="byType">
                        <div class="header-title">By Type <span class="count">3</span></div>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z" />
                        </svg>
                    </h6>
                    <div class="collapse" id="byType">
                        <div class="filter-options">
                            <span class="filter-option">Manufacturer</span>
                            <span class="filter-option">Wholesaler</span>
                            <span class="filter-option">Admin</span>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="filter-section">
                    <h6 class="filter-header" data-bs-toggle="collapse" aria-expanded="false" href="#bySize" role="button" aria-controls="bySize">
                        <div class="header-title">By Size <span class="count">3</span></div>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z" />
                        </svg>
                    </h6>
                    <div class="collapse" id="bySize">
                        <div class="filter-options">
                            <span class="filter-option selected">395×395 mm</span>
                            <span class="filter-option">800×800 mm</span>
                            <span class="filter-option">200×1200 mm</span>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="filter-section">
                    <h6 class="filter-header" data-bs-toggle="collapse" aria-expanded="false" href="#byCategory" role="button" aria-controls="byCategory">
                        <div class="header-title">By Category <span class="count">5</span></div>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z" />
                        </svg>
                    </h6>
                    <div class="collapse" id="byCategory">
                        <div class="filter-options">
                            <span class="filter-option">Marble</span>
                            <span class="filter-option">Texture</span>
                            <span class="filter-option">Mosaic</span>
                            <span class="filter-option">Pattern</span>
                            <span class="filter-option">Stone</span>
                            <span class="filter-option">Cement</span>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="filter-section">
                    <h6 class="filter-header" data-bs-toggle="collapse" aria-expanded="false" href="#byLook" role="button" aria-controls="byLook">
                        <div class="header-title">By Look <span class="count">6</span></div>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z" />
                        </svg>
                    </h6>
                    <div class="collapse" id="byLook">
                        <div class="filter-options">
                            <span class="filter-option">Marble</span>
                            <span class="filter-option">Texture</span>
                            <span class="filter-option">Mosaic</span>
                            <span class="filter-option">Pattern</span>
                            <span class="filter-option">Stone</span>
                            <span class="filter-option">Cement</span>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="filter-section">
                    <h6 class="filter-header" data-bs-toggle="collapse" aria-expanded="false" href="#byFinish" role="button" aria-controls="byFinish">
                        <div class="header-title">By Finish <span class="count">4</span></div>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z" />
                        </svg>
                    </h6>
                    <div class="collapse" id="byFinish">
                        <div class="filter-options">
                            <span class="filter-option">Matt</span>
                            <span class="filter-option">Glossy</span>
                            <span class="filter-option">Super Glossy</span>
                            <span class="filter-option">Sugar Finish</span>
                        </div>
                    </div>
                </div>
                <hr />
  </div>
</div>


<!-- Filter toggle button (for mobile) -->
<button class="filter-toggle d-block d-lg-none" onclick="openFilter()">☰ Open Filters</button>

    <script>
  function openFilter() {
    document.querySelector('.filter-home-col-2').classList.add('active');
  }

  function closeFilter() {
    document.querySelector('.filter-home-col-2').classList.remove('active');
  }
</script>

</body>
</html>
